<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Pagina HTML standard">
  <title>x letizia</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <div class="content">
      <button class="letter" type="button" aria-label="Apri la lettera" aria-controls="image-container">
        <img id="letter-image" src="images/closed.gif" alt="Lettera chiusa">
      </button>

      <div id="image-container" class="image-container" hidden>
        <img src="images/please.jpeg" alt="Immagine nella lettera">
      </div>
    </div>
  </main>
  <script>
    const letter = document.querySelector('.letter');
    const letterImage = document.querySelector('#letter-image');
    const imageContainer = document.querySelector('#image-container');

    letter.addEventListener('click', () => {
      letter.disabled = true;
      letterImage.src = 'images/opening.gif';
      letterImage.alt = 'Lettera in apertura';

      window.setTimeout(() => {
        letter.hidden = true;
        imageContainer.hidden = false;
      }, 1000);
    });
  </script>
</body>
</html>
